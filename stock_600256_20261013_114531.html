var RED='#ff3b30', GREEN='#34c759';
function kline(d, box, title){
  if(!d || !d.ohlc || !d.ohlc.length) return null;
  var series=[{type:'candlestick',name:'K线',data:d.ohlc,
    itemStyle:{color:RED,color0:GREEN,borderColor:RED,borderColor0:GREEN}}];
  if(d.ma5 && d.ma5.length) series.push({type:'line',name:'MA5',data:d.ma5,symbol:'none',smooth:true,lineStyle:{width:1,color:'#ff2d55'}});
  if(d.ma10 && d.ma10.length) series.push({type:'line',name:'MA10',data:d.ma10,symbol:'none',smooth:true,lineStyle:{width:1,color:'#ff9500'}});
  if(d.ma20 && d.ma20.length) series.push({type:'line',name:'MA20',data:d.ma20,symbol:'none',smooth:true,lineStyle:{width:1,color:'#0071e3'}});
  if(box && box.high && box.low){
    series[0].markLine={symbol:'none',data:[
      {yAxis:box.high,name:'箱顶',lineStyle:{type:'dashed',color:'#ff9800'}},
      {yAxis:box.low,name:'箱底',lineStyle:{type:'dashed',color:'#42a5f5'}}]};
  }
  return {backgroundColor:'transparent',textStyle:{color:'#424245'},
    title:{text:title,left:'center',textStyle:{fontSize:14,color:'#1d1d1f'}},
    legend:{top:24,textStyle:{color:'#6e6e73'},data:['K线','MA5','MA10','MA20']},
    tooltip:{trigger:'axis',axisPointer:{type:'cross'}},
    grid:{left:56,right:20,top:64,bottom:44},

    dataZoom:[{type:'inside'},{type:'slider',height:16,bottom:8,textStyle:{color:'#86868b'}}],
    series:series};
}
function vol(d, title){
  if(!d || !d.vol || !d.vol.length) return null;
  var data=d.vol.map(function(v,i){
    var up=(d.ohlc[i] && d.ohlc[i][1]>=d.ohlc[i][0]);
    return {value:v,itemStyle:{color: up?RED:GREEN}};});
  return {backgroundColor:'transparent',textStyle:{color:'#424245'},
    title:{text:title,left:'center',textStyle:{fontSize:12,color:'#6e6e73'}},
    tooltip:{trigger:'axis'},

    series:[{type:'bar',data:data}]};
}
