var RED='#ff3b30', GREEN='#34c759';
function kline(d, box, title){
  if(!d || !d.ohlc || !d.ohlc.length) return null;
  var series=[{type:'candlestick',name:'K线',data:d.ohlc,
    itemStyle:{color:RED,color0:GREEN,borderColor:RED,borderColor0:GREEN}}];
  if(d.ma5 && d.ma5.length) series.push({type:'line',name:'MA5',data:d.ma5,symbol:'none',smooth:true,lineStyle:{width:1,color:'#ff2d55'}});
  if(d.ma10 && d.ma10.length) series.push({type:'line',name:'MA10',data:d.ma10,symbol:'none',smooth:true,lineStyle:{width:1,color:'#ff9500'}});
  if(d.ma20 && d.ma20.length) series.push({type:'line',name:'MA20',data:d.ma20,symbol:'none',smooth:true,lineStyle:{width:1,color:'#0071e3'}});
  if(box && box.high && box.low){
    series[0].markLine={symbol:'none',data:[
      {yAxis:box.high,name:'箱顶',lineStyle:{type:'dashed',color:'#ff9800'}},
      {yAxis:box.low,name:'箱底',lineStyle:{type:'dashed',color:'#42a5f5'}}]};
  }
  return {backgroundColor:'transparent',textStyle:{color:'#424245'},
    title:{text:title,left:'center',textStyle:{fontSize:14,color:'#1d1d1f'}},
    legend:{top:24,textStyle:{color:'#6e6e73'},data:['K线','MA5','MA10','MA20']},
    tooltip:{trigger:'axis',axisPointer:{type:'cross'}},
    grid:{left:56,right:20,top:64,bottom:44},
    xAxis:{type:'category',data:d.dates,boundaryGap:true,axisLabel:{color:'#86868b'}},
    yAxis:{scale:true,axisLabel:{color:'#86868b'},splitLine:{lineStyle:{color:'#e5e5ea'}}},
    dataZoom:[{type:'inside'},{type:'slider',height:16,bottom:8,textStyle:{color:'#86868b'}}],
    series:series};
}
function vol(d, title){
  if(!d || !d.vol || !d.vol.length) return null;
  var data=d.vol.map(function(v,i){
    var up=(d.ohlc[i] && d.ohlc[i][1]>=d.ohlc[i][0]);
    return {value:v,itemStyle:{color: up?RED:GREEN}};});
  return {backgroundColor:'transparent',textStyle:{color:'#424245'},
    title:{text:title,left:'center',textStyle:{fontSize:12,color:'#6e6e73'}},
    tooltip:{trigger:'axis'},
    grid:{left:56,right:20,top:30,bottom:30},
    xAxis:{type:'category',data:d.dates,axisLabel:{color:'#86868b'}},
    yAxis:{scale:true,axisLabel:{color:'#86868b'},splitLine:{lineStyle:{color:'#e5e5ea'}}},
    series:[{type:'bar',data:data}]};
}
function macd(d, title){
  if(!d || !d.dif || !d.dif.length) return null;
  var bars=d.macd.map(function(v){return {value:v,itemStyle:{color: v>=0?RED:GREEN}};});
  return {backgroundColor:'transparent',textStyle:{color:'#424245'},
    title:{text:title,left:'center',textStyle:{fontSize:12,color:'#6e6e73'}},
    legend:{top:22,textStyle:{color:'#6e6e73'},data:['DIF','DEA','MACD']},
    tooltip:{trigger:'axis'},
    grid:{left:56,right:20,top:44,bottom:30},
    xAxis:{type:'category',data:d.dates,axisLabel:{color:'#86868b'}},
    yAxis:{scale:true,axisLabel:{color:'#86868b'},splitLine:{lineStyle:{color:'#e5e5ea'}}},
    series:[{type:'bar',name:'MACD',data:bars},
      {type:'line',name:'DIF',data:d.dif,symbol:'none',lineStyle:{width:1,color:'#ff2d55'}},
      {type:'line',name:'DEA',data:d.dea,symbol:'none',lineStyle:{width:1,color:'#0071e3'}}]};
}
function minute(d, title){
  if(!d || !d.close || !d.close.length) return null;
  return {backgroundColor:'transparent',textStyle:{color:'#424245'},
    title:{text:title,left:'center',textStyle:{fontSize:14,color:'#1d1d1f'}},
    legend:{top:24,textStyle:{color:'#6e6e73'},data:['价格','成交量']},
    tooltip:{trigger:'axis'},
    grid:{left:56,right:56,top:64,bottom:40},
    xAxis:{type:'category',data:d.dates,axisLabel:{color:'#86868b'}},
    yAxis:[{scale:true,name:'价',axisLabel:{color:'#86868b'},splitLine:{lineStyle:{color:'#e5e5ea'}}},
           {scale:true,name:'量',position:'right',axisLabel:{color:'#86868b'},splitLine:{show:false}}],
    series:[{type:'line',name:'价格',data:d.close,symbol:'none',lineStyle:{color:'#ff2d55'}},
      {type:'bar',name:'成交量',yAxisIndex:1,data:d.vol,itemStyle:{color:'#c7c7cc'}}]};
}
function render(id, opt){
  if(!opt) return;
  var el=document.getElementById(id);
  echarts.init(el).setOption(opt);
}
render('c1', kline(P.daily, P.box, '日K线 + 周线箱体'));
render('c2', vol(P.daily, '日成交量'));
render('c3', macd(P.daily, '日线 MACD'));
render('c4', kline(P.weekly, P.box, '周K线 + 箱体'));
render('c5', minute(P.minute, '分时（5分钟）'));
window.addEventListener('resize', function(){

});
